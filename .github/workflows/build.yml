name: Build Games Khabar AAB for Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json || echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Configure Gradle Maven Mirror & HTTP Retry (Fix 429 Too Many Requests)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.init.gradle
          def GOOGLE_MAVEN_CENTRAL = "https://maven-central.storage-download.googleapis.com/maven2/"

          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url GOOGLE_MAVEN_CENTRAL }
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }

          allprojects {
              buildscript {
                  repositories {
                      maven { url GOOGLE_MAVEN_CENTRAL }
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              repositories {
                  maven { url GOOGLE_MAVEN_CENTRAL }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat << 'EOF' >> ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4G -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=3000
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          # Also patch Flutter SDK's included gradle build so :gradle:compileGroovy uses Google Maven Central mirror first
          FLUTTER_GRADLE_DIR="$(dirname $(which flutter))/../packages/flutter_tools/gradle"
          if [ -f "$FLUTTER_GRADLE_DIR/build.gradle.kts" ]; then
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n    mavenCentral()|g' "$FLUTTER_GRADLE_DIR/build.gradle.kts" || true
          fi
          if [ -f "$FLUTTER_GRADLE_DIR/build.gradle" ]; then
            sed -i 's|mavenCentral()|maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }\n        mavenCentral()|g' "$FLUTTER_GRADLE_DIR/build.gradle" || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo "85642a38d174c49302b00cca0721e87d706dd433" >> "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license" || true
          yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Decode Keystore and create key.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Show SHA
        run: |
          if [ -f android/app/upload-keystore.jks ]; then
            keytool -list -v -keystore android/app/upload-keystore.jks -alias "${{ secrets.KEY_ALIAS }}" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep -E "SHA1|SHA-256" || true
          fi

      - name: Build AAB
        run: |
          for attempt in 1 2 3; do
            echo "Building AAB (Attempt $attempt)..."
            if flutter build appbundle --release --android-skip-build-dependency-validation; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Retrying after 10 seconds..."
            sleep 10
          done

      - name: Build Split APKs (Lightweight ~25MB)
        run: |
          for attempt in 1 2 3; do
            echo "Building Split APKs (Attempt $attempt)..."
            if flutter build apk --release --split-per-abi --android-skip-build-dependency-validation; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Retrying after 10 seconds..."
            sleep 10
          done

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifacts (Split ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
