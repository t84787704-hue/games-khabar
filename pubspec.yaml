name: games_khabar
description: "Games Khabar - Pakistan's #1 Urdu Gaming News & Free Games App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.1.0
  shared_preferences: ^2.3.0
  http: ^1.2.2
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  google_mobile_ads: ^5.2.0
  google_mlkit_text_recognition: ^0.13.0
  flutter_linkify: ^6.0.0
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  translator: ^1.0.0
  webview_flutter: ^4.8.0
  youtube_player_flutter: ^9.1.1
  youtube_player_iframe: ^5.1.2
  cloud_functions: ^5.1.3
  xml: ^6.5.0
  html: ^0.15.4
  path_provider: ^2.1.4
  ffmpeg_kit_flutter_new: ^4.6.0

# یہاں wakelock_plus کو 1.3.0 کر دیا گیا ہے
dependency_overrides:
  video_player: 2.8.2
  chewie: 1.7.4
  package_info_plus: 8.0.0
  wakelock_plus: 1.3.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/