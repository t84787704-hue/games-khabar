name: games_khabar
description: "Games Khabar - Pakistan's #1 Urdu Gaming News & Free Games App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0
  firebase_auth: ^4.19.0
  firebase_messaging: ^14.9.0
  flutter_local_notifications: ^17.1.0
  shared_preferences: ^2.2.3
  http: ^1.2.0
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  url_launcher: ^6.2.6
  cached_network_image: ^3.3.1
  google_mobile_ads: ^5.1.0
  easy_localization: ^3.0.7
  google_fonts: ^6.2.1
  translator: ^1.0.3
  webview_flutter: ^4.7.0
  youtube_player_flutter: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
